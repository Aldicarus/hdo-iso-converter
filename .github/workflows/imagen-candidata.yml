name: Imagen candidata (sin publicar)

# Construye la imagen en CI y la deja como ARTEFACTO del run —un tar de
# `docker save`—, sin subirla a GHCR ni tocar `latest`. Es para probar una
# subida de herramientas con la regresión real (`app/tools/regresion_real.py`)
# en el NAS cuando el NAS no puede construir: su ZFS falla a veces en el
# export de la imagen con «device or resource busy», y la única cura conocida
# es reiniciarlo (pasó el 2026-10-13 y el 2026-10-28). Cargar una imagen
# (`docker load`) no pasa por ese camino.
#
#   git push origin HEAD:candidata/<nombre>
#   gh run download <id> -n imagen-candidata      # imagen.tar
#   scp imagen.tar nas:… && docker load -i imagen.tar
#
# Lleva los mismos build-args que la publicación, para que lo que se prueba
# sea lo que se publicaría. Sin el `workflow_dispatch` de la publicación a
# propósito: aquella reescribe `latest` siempre.
on:
  push:
    branches: ['candidata/**']

concurrency:
  group: imagen-candidata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # El stage `version-detector` hace `git describe --match 'v*'`.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: hdo-iso-converter:candidata
          build-args: |
            APP_VERSION=candidata-${{ github.sha }}
            APP_COMMIT=${{ github.sha }}
            TMDB_APP_KEY=${{ secrets.TMDB_APP_KEY }}
            CMV40_DRIVE_FOLDER_APP=${{ secrets.CMV40_DRIVE_FOLDER_APP }}
          outputs: type=docker,dest=${{ runner.temp }}/imagen.tar

      - name: Subir la imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagen-candidata
          path: ${{ runner.temp }}/imagen.tar
          retention-days: 3
          if-no-files-found: error
